<div id="bnav"></div>
<div class="scrim" id="scrim"></div>
<aside class="ledger" id="ledger" aria-label="Your selection"><div class="lh"><h3>Trip ledger</h3><button type="button" class="btn sm" id="ledgerClose">Close ✕</button></div><div class="lb" id="ledgerBody"></div></aside>
<script id="trip-data" type="application/json">__TRIP_DATA_JSON__</script>
<script>/*__ENGINE__*/</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('trip-data').textContent);
  const E = window.TripEngine(DATA, { key: 'control' }), S = E.state, H = E.html, esc = E.esc, money = E.money;
  const m = E.metaTxt(), groups = E.groupsPresent();
  const SCREENS = groups.map(g => ({ id: g.id, label: E.SHORT_LABEL[g.id] || g.label, icon: g.icon }));
  document.getElementById('t-title').textContent = m.route;
  document.getElementById('t-meta').innerHTML = `<span>${m.nights} nights</span><span>${m.travelers} traveler${m.travelers > 1 ? 's' : ''}</span><span>${esc(m.tripType)}</span>`;
  document.getElementById('t-dates').innerHTML = `<span><small>Check-in</small><b>${esc(E.fmtDateY(E.trip.start_date))}</b></span><span><small>Check-out</small><b>${esc(E.fmtDateY(E.trip.end_date))}</b></span>`;
  document.getElementById('t-fx').innerHTML = H.fxStrip();
  document.getElementById('r-foot').textContent = `${E.items.length} researched lines · ${E.trip.currency}`;
  document.title = E.titleTxt + ' · Mission Control';
  if (!groups.some(g => g.id === S.group)) S.group = groups[0].id;
  const secCount = g => g.secs.reduce((n, s) => n + E.items.filter(it => it.category === s).length, 0);
  function paint(why) {
    const y = scrollY, k = E.kpis(S.tier);
    if (!groups.some(g => g.id === S.group)) S.group = groups[0].id;
    document.getElementById('r-tiers').innerHTML = H.tierTabs(S.tier);
    document.getElementById('r-cur').innerHTML = `${esc(E.tierLabel(S.tier))}<b>${money(k.total)}</b>`;
    document.getElementById('r-nav').innerHTML = groups.map(g => `<button type="button" data-act="group" data-val="${g.id}" aria-selected="${S.group === g.id}"><span>${g.icon}</span>${esc(g.label)}<span class="n">${secCount(g) || ''}</span></button>`).join('');
    document.getElementById('gtabs').innerHTML = groups.map(g => `<button type="button" data-act="group" data-val="${g.id}" aria-selected="${S.group === g.id}">${g.icon} ${esc(g.label)}</button>`).join('');
    document.getElementById('bnav').innerHTML = H.bottomNav(SCREENS, S.group, (groups.find(x => x.id === S.group) || { secs: [] }).secs.map(s => ({ id: s, label: E.secLabel(s) })));
    document.getElementById('r-side').innerHTML = H.origSide({ skip: ['fx'] });
    document.getElementById('t-tier').textContent = E.tierLabel(S.tier);
    document.getElementById('t-total').textContent = money(k.total);
    document.getElementById('strip').innerHTML = `<div class="kpi"><small>Selected total</small><b>${money(k.total)}</b><span>${k.lines} lines · ${money(k.pp)} per person</span></div><div class="kpi"><small>Per day</small><b>${money(k.pd)}</b><span>${E.days} days</span></div><div class="kpi bdk"><small>Where the money goes</small>${H.breakdown(S.tier)}</div>`;
    const g = groups.find(x => x.id === S.group);
    document.getElementById('main').innerHTML = g.secs.map(s => H.section(s, { initial: 60 })).join('');
    document.getElementById('ledgerBody').innerHTML = `<div><h4>Selected lines</h4>${H.selection(S.tier)}</div><div><h4>Compare tiers</h4>${H.compare(S.tier)}</div>`;
    if (why === 'group' || why === 'tier') scrollTo(0, 0); else scrollTo(0, y);
    setOffset(); spy();
  }
  // jumps to a card must land below the sticky two-row header: keep --scroll-top equal to its real height
  function setOffset() { const tb = document.querySelector('.topbar'); if (tb) document.documentElement.style.setProperty('--scroll-top', (tb.offsetHeight + 14) + 'px'); }
  addEventListener('resize', setOffset);
  // highlight the bottom-nav subsection that is on screen
  let io = null;
  function spy() {
    if (io) io.disconnect();
    const secs = [...document.querySelectorAll('#main .sec[data-sec]')]; if (!secs.length) return;
    const mark = id => document.querySelectorAll('.bn-subs .sub').forEach(b => b.classList.toggle('active', b.dataset.sub === id));
    io = new IntersectionObserver(es => { const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top); if (vis.length) mark(vis[0].target.dataset.sec); }, { rootMargin: '-35% 0px -55% 0px' });
    secs.forEach(s => io.observe(s)); mark(secs[0].dataset.sec);
  }
  E.bind(document.body, paint);
  paint('init');
  // partial builds (build_dashboard.py --partial / --map-pending): say what is still being researched and reload every minute
  (function pending() {
    const pend = E.trip.pending || []; if (!pend.length) return;
    const labels = pend.filter(id => id !== 'map').map(id => (E.CATS.find(c => c.id === id) || { label: id }).label.toLowerCase());
    const head = labels.length ? `Still searching ${esc(labels.join(', '))}${pend.includes('map') ? ", then the nearby places" : ''}.` : 'Every price is in; the nearby places are still loading.';
    const el = document.createElement('div'); el.className = 'pending'; el.innerHTML = `<span class="dotpulse" aria-hidden="true"></span><span><strong>${head}</strong> This page checks for the finished version every minute and reloads itself (your ticks are kept).</span>`;
    document.querySelector('.topbar').after(el);
    let lastInput = Date.now(); ['scroll', 'keydown', 'pointerdown'].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, { passive: true }));
    setInterval(() => { if (Date.now() - lastInput < 15000 && !document.hidden) return; try { sessionStorage.setItem('mc:scroll', String(scrollY)); } catch (e) { } location.reload(); }, 60000);
  })();
  try { const y = sessionStorage.getItem('mc:scroll'); if (y) { sessionStorage.removeItem('mc:scroll'); scrollTo(0, +y); } } catch (e) { }
  const led = document.getElementById('ledger'), scrim = document.getElementById('scrim');
  const openL = v => { led.classList.toggle('is-open', v); scrim.classList.toggle('on', v); };
  document.getElementById('ledgerBtn').addEventListener('click', () => openL(!led.classList.contains('is-open')));
  document.getElementById('ledgerClose').addEventListener('click', () => openL(false)); scrim.addEventListener('click', () => openL(false));
  led.addEventListener('click', e => { if ((e.target.closest('[data-act="jump"]') || e.target.closest('[data-act="goto"]')) && !e.target.closest('a[target]')) openL(false); });
  const root = document.documentElement; let theme = 'dark'; try { theme = localStorage.getItem('control:theme') || 'dark'; } catch (e) { }
  const apply = () => { root.setAttribute('data-theme', theme); try { localStorage.setItem('control:theme', theme); } catch (e) { } document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark'; };
  document.getElementById('themeBtn').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; apply(); }); apply();
})();
</script>
</body>
</html>
